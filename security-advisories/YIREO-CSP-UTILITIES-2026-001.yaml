published: "2026-11-25T00:00:00Z"
modified: "2026-11-25T00:00:00Z"
aliases: []
summary: Content Security Policy bypass for HTML injected into processed blocks
details: >
  ReplaceInlineScripts matched elements whose tag name only started with "script" as inline scripts.
  When adding a CSP nonce, such an element was rewritten into a regular script element with a valid
  nonce, so that HTML injected into a processed block could be turned into an executable script that
  the Content Security Policy would otherwise have blocked. Version 1.1.0 only matches real script
  elements and parses script attributes and closing tags more strictly. In addition, ReplaceInlineScripts::replace()
  adds a nonce or hash to every inline script in the processed HTML, including injected scripts.
  Version 1.1.0 deprecates this method and adds ReplaceInlineScripts::replaceMarked(), which only
  trusts scripts carrying a per-request marker. Integrators are advised to migrate to replaceMarked().
  Exploitation requires an existing HTML injection vulnerability in a block processed by this module.
